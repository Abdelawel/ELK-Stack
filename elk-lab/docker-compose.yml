version: '3.8'

services:

  # ─────────────────────────────────────────
  # ELASTICSEARCH  — search & storage engine
  # ─────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node        # single-node mode for the lab
      - xpack.security.enabled=false       # disable auth so Kibana/Logstash can connect without certs
      - ES_JAVA_OPTS=-Xms1g -Xmx1g        # 1 GB heap — enough for a lab
    ports:
      - "9200:9200"                        # REST API — open http://localhost:9200 to verify
    volumes:
      - esdata:/usr/share/elasticsearch/data   # persist index data across restarts
    networks:
      - elk
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 | grep -q 'cluster_name'"]
      interval: 20s
      timeout: 10s
      retries: 10

  # ─────────────────────────────────────────
  # LOGSTASH  — parsing & routing pipeline
  # ─────────────────────────────────────────
  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.0
    container_name: logstash
    ports:
      - "5044:5044"                        # Beats input — Filebeat & Winlogbeat send here
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline   # mounts your logstash.conf
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml
    networks:
      - elk
    depends_on:
      elasticsearch:
        condition: service_healthy          # wait for ES to be ready before starting
    environment:
      - LS_JAVA_OPTS=-Xms512m -Xmx512m

  # ─────────────────────────────────────────
  # KIBANA  — visualisation dashboard
  # ─────────────────────────────────────────
  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0
    container_name: kibana
    ports:
      - "5601:5601"                        # open http://localhost:5601 to access the UI
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    networks:
      - elk
    depends_on:
      elasticsearch:
        condition: service_healthy

# ─────────────────────────────────────────
# VOLUMES & NETWORKS
# ─────────────────────────────────────────
volumes:
  esdata:
    driver: local

networks:
  elk:
    driver: bridge
