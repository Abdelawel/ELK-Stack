# =============================================================
#  LOGSTASH PIPELINE — Chapter 5 SRE Lab
#  Handles two data streams:
#    1. Nginx access logs  (from Filebeat on Linux Node A)
#    2. Windows Security events (from Winlogbeat on Windows Node B)
# =============================================================


# ─────────────────────────────────────────
# INPUT
# All Beats agents (Filebeat + Winlogbeat)
# connect to this single port.
# ─────────────────────────────────────────
input {
  beats {
    port => 5044
  }
}


# ─────────────────────────────────────────
# FILTER
# We check the log_source field set in
# filebeat.yml / winlogbeat.yml to decide
# which parsing path to apply.
# ─────────────────────────────────────────
filter {

  # ───────────────────────────────────────
  # PATH 1 — Nginx access logs
  # ───────────────────────────────────────
  if [log_source] == "nginx" {

    # GROK: break the raw Combined Log Format string into named fields
    # Example input line:
    #   192.168.1.5 - - [12/Apr/2025:14:32:01 +0000] "GET /checkout HTTP/1.1" 200 542 "-" "curl/7.88"
    grok {
      match => {
        "message" => '%{IPORHOST:client_ip} - %{DATA:ident} \[%{HTTPDATE:raw_timestamp}\] \"%{WORD:http_method} %{URIPATHPARAM:request_uri} HTTP/%{NUMBER:http_version}\" %{NUMBER:http_status_code} %{NUMBER:bytes_sent} \"%{DATA:referrer}\" \"%{DATA:user_agent}\"'
      }
      tag_on_failure => ["_grokparsefailure_nginx"]
    }

    # DATE: parse the Nginx timestamp into the standard @timestamp field
    date {
      match => ["raw_timestamp", "dd/MMM/yyyy:HH:mm:ss Z"]
      target => "@timestamp"
      remove_field => ["raw_timestamp"]
    }

    # GEOIP: enrich client IP with country, city, coordinates
    geoip {
      source => "client_ip"
      target => "geoip"
    }

    # MUTATE: convert types so Kibana can do numeric filters/charts
    mutate {
      convert => {
        "http_status_code" => "integer"
        "bytes_sent"       => "integer"
      }
    }

    # TAG error responses for easy filtering in Kibana
    if [http_status_code] >= 400 {
      mutate { add_tag => ["http_error"] }
    }

    if [http_status_code] == 404 {
      mutate { add_tag => ["not_found"] }
    }

    if [http_status_code] == 200 {
      mutate { add_tag => ["success"] }
    }
  }


  # ───────────────────────────────────────
  # PATH 2 — Windows Security events
  # Winlogbeat already ships structured
  # JSON so we mostly just enrich it.
  # ───────────────────────────────────────
  if [log_source] == "windows_security" {

    mutate {
      add_field => { "event_category" => "authentication" }
    }

    # Tag by event type for easy dashboard filtering
    if [winlog][event_id] == 4624 {
      mutate { add_tag => ["logon_success"] }
    }

    if [winlog][event_id] == 4625 {
      mutate { add_tag => ["logon_failure"] }
    }

    # Promote nested fields to top level for simpler Kibana columns
    mutate {
      rename => {
        "[winlog][event_id]"                        => "event_id"
        "[winlog][event_data][TargetUserName]"       => "account_name"
        "[winlog][event_data][IpAddress]"            => "source_ip"
        "[winlog][event_data][LogonType]"            => "logon_type"
        "[winlog][computer_name]"                    => "computer_name"
      }
    }
  }

}


# ─────────────────────────────────────────
# OUTPUT
# Route each stream to its own daily index.
# Separate indexes keep Kibana index
# patterns clean and queries fast.
# ─────────────────────────────────────────
output {

  # Route Nginx logs to nginx-logs-YYYY.MM.dd
  if [log_source] == "nginx" {
    elasticsearch {
      hosts    => ["http://elasticsearch:9200"]
      index    => "nginx-logs-%{+YYYY.MM.dd}"
    }
  }

  # Route Windows Security events to windows-security-YYYY.MM.dd
  else if [log_source] == "windows_security" {
    elasticsearch {
      hosts    => ["http://elasticsearch:9200"]
      index    => "windows-security-%{+YYYY.MM.dd}"
    }
  }

  # Catch-all for anything else
  else {
    elasticsearch {
      hosts    => ["http://elasticsearch:9200"]
      index    => "generic-logs-%{+YYYY.MM.dd}"
    }
  }

  # Uncomment the block below during debugging to also print
  # every event to the Logstash container logs:
  # stdout {
  #   codec => rubydebug
  # }

}
