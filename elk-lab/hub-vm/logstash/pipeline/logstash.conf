# =============================================================
#  LOGSTASH PIPELINE — Hub & Windows Only
#  Handles two data streams:
#    1. Windows Security events (Windows Node B)
#    2. Checkout Microservice logs (Hub Node)
# =============================================================

input {
  beats {
    port => 5044
  }
}

filter {

  # PATH 1 — Windows Security events
  if [log_source] == "windows_security" {
    mutate { add_field => { "event_category" => "authentication" } }
    if [winlog][event_id] == 4624 { mutate { add_tag => ["logon_success"] } }
    if [winlog][event_id] == 4625 { mutate { add_tag => ["logon_failure"] } }
    mutate {
      rename => {
        "[winlog][event_id]" => "event_id"
        "[winlog][event_data][TargetUserName]" => "account_name"
        "[winlog][event_data][IpAddress]" => "source_ip"
      }
    }
  }

  # PATH 2 — Checkout Microservice
  if [log_source] == "checkout_service" {
    grok {
      match => { "message" => "%{TIMESTAMP_ISO8601:timestamp} - %{LOGLEVEL:level} - Processing checkout request. Latency: %{NUMBER:latency:float}s" }
    }
    mutate {
      add_field => { "app_name" => "checkout-microservice" }
    }
  }

}

output {
  if [log_source] == "windows_security" {
    elasticsearch { hosts => ["http://elasticsearch:9200"] index => "windows-security-%{+YYYY.MM.dd}" }
  }
  else if [log_source] == "checkout_service" {
    elasticsearch { hosts => ["http://elasticsearch:9200"] index => "checkout-metrics-%{+YYYY.MM.dd}" }
  }
  else {
    elasticsearch { hosts => ["http://elasticsearch:9200"] index => "generic-logs-%{+YYYY.MM.dd}" }
  }
}
