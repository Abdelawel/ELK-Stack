# =============================================================
#  WINLOGBEAT CONFIG — Windows Edge Node B
#  Captures Security events 4624 & 4625 and ships to Logstash.
#  Replace <HUB_IP> with your Hub machine's actual IP address.
# =============================================================

winlogbeat.event_logs:
  - name: Security
    event_id: 4624, 4625              # 4624 = logon success, 4625 = logon failure
    fields:
      log_source: windows_security    # Logstash uses this to pick the right filter
      environment: lab
    fields_under_root: true

processors:
  - add_host_metadata: ~

output.logstash:
  hosts: ["<HUB_IP>:5044"]           # ← replace with your Hub machine IP

logging.level: info
logging.to_files: true
logging.files:
  path: 'C:\ProgramData\winlogbeat\logs'
  name: winlogbeat.log
  keepfiles: 7
